<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mandelbulb 3D — Strange Attractor</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#eee;font-family:system-ui,sans-serif;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh}
  #ui{position:fixed;top:10px;left:10px;background:rgba(15,15,25,.78);
      padding:12px 14px;border-radius:10px;backdrop-filter:blur(6px);
      max-width:300px;font-size:12px;z-index:10;border:1px solid #333}
  #ui h3{margin:0 0 8px;font-size:13px;color:#9ff}
  #ui label{display:block;margin:6px 0 2px;color:#bbb}
  #ui input[type=range],#ui select,#ui input[type=number]{width:100%;background:#222;color:#eee;border:1px solid #444;border-radius:4px}
  #ui .row{display:flex;gap:6px}
  #ui .row>*{flex:1}
  button{background:#246;color:#fff;border:0;padding:6px 10px;border-radius:5px;cursor:pointer;margin-top:8px;width:100%}
  button:hover{background:#368}
  #info{position:fixed;bottom:10px;left:10px;font-size:12px;color:#9cf;background:rgba(0,0,0,.4);padding:6px 10px;border-radius:6px;z-index:10}
  #toggle{position:fixed;top:10px;right:10px;z-index:11}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="toggle" style="width:auto">Hide UI</button>
<div id="ui">
  <h3>Mandelbulb Attractor</h3>
  <div class="row">
    <div><label>n start</label><input id="nStart" type="number" value="4" step="0.5" min="2" max="30"></div>
    <div><label>n end</label><input id="nEnd" type="number" value="20" step="0.5" min="2" max="40"></div>
  </div>
  <label>Color palette</label>
  <select id="palette">
    <option value="0">1 — Fire & Gold</option>
    <option value="1">2 — Ice Blue</option>
    <option value="2">3 — Aurora</option>
    <option value="3">3 — Magenta Nebula</option>
    <option value="4">5 — Emerald</option>
    <option value="5">6 — Sunset</option>
    <option value="6">7 — Monochrome Pearl</option>
    <option value="7">8 — Psychedelic</option>
  </select>
  <label>Light style</label>
  <select id="lightStyle">
    <option value="0">Soft warm</option>
    <option value="1">Cold harsh</option>
    <option value="2">Dramatic rim</option>
    <option value="3">Studio</option>
  </select>
  <label>Light intensity <span id="liVal">1.4</span></label>
  <input id="lightI" type="range" min="0.2" max="3" step="0.05" value="1.4">
  <label>Light azimuth <span id="laVal">35°</span></label>
  <input id="lightA" type="range" min="0" max="360" step="1" value="35">
  <label>Light elevation <span id="leVal">45°</span></label>
  <input id="lightE" type="range" min="-30" max="89" step="1" value="45">
  <label>Resolution scale <span id="rsVal">1.0</span></label>
  <input id="resScale" type="range" min="0.4" max="1.5" step="0.05" value="1.0">
  <button id="restart">⟳ Restart animation</button>
</div>
<div id="info">t=<span id="t">0.0</span>s &nbsp; n=<span id="nv">4.0</span> &nbsp; phase: <span id="ph">forming</span></div>

<script id="vert" type="x-shader/x-vertex">
attribute vec2 p;
void main(){ gl_Position=vec4(p,0.0,1.0); }
</script>

<script id="frag" type="x-shader/x-fragment">
precision highp float;
uniform vec2 uRes;
uniform float uTime;
uniform float uPower;
uniform int   uIter;
uniform vec3  uCamPos;
uniform vec3  uCamTgt;
uniform vec3  uLightDir;
uniform float uLightI;
uniform int   uPalette;
uniform int   uLightStyle;

const int MAX_ITER = 16;
const int MAX_STEPS = 140;
const float MAX_DIST = 8.0;
const float MIN_DIST = 0.0008;

// Mandelbulb distance estimator
float DE(vec3 pos, out float trap){
    vec3 z = pos;
    float dr = 1.0;
    float r = 0.0;
    trap = 1e10;
    float pwr = uPower;
    for(int i=0;i<MAX_ITER;i++){
        if(i>=uIter) break;
        r = length(z);
        if(r>2.0) break;
        // polar
        float theta = acos(clamp(z.z/r,-1.0,1.0));
        float phi   = atan(z.y, z.x);
        dr = pow(r, pwr-1.0)*pwr*dr + 1.0;
        float zr = pow(r, pwr);
        theta *= pwr; phi *= pwr;
        z = zr*vec3(sin(theta)*cos(phi), sin(theta)*sin(phi), cos(theta));
        z += pos;
        trap = min(trap, dot(z,z));
    }
    return 0.5*log(max(r,1e-6))*r/dr;
}

vec3 calcNormal(vec3 p){
    float e=0.0015;
    float t;
    vec2 h = vec2(1.0,-1.0)*0.5773;
    return normalize( h.xyy*DE(p+h.xyy*e,t) +
                      h.yyx*DE(p+h.yyx*e,t) +
                      h.yxy*DE(p+h.yxy*e,t) +
                      h.xxx*DE(p+h.xxx*e,t) );
}

float softShadow(vec3 ro, vec3 rd, float k){
    float res = 1.0;
    float t = 0.02;
    float tr;
    for(int i=0;i<24;i++){
        float h = DE(ro+rd*t, tr);
        if(h<0.001) return 0.0;
        res = min(res, k*h/t);
        t += clamp(h,0.01,0.2);
        if(t>3.0) break;
    }
    return clamp(res,0.0,1.0);
}

float ao(vec3 p, vec3 n){
    float occ=0.0, sca=1.0, tr;
    for(int i=0;i<5;i++){
        float h = 0.01 + 0.12*float(i)/4.0;
        float d = DE(p+n*h, tr);
        occ += (h-d)*sca;
        sca *= 0.85;
    }
    return clamp(1.0-1.5*occ,0.0,1.0);
}

vec3 palette(float t, float trap){
    t = clamp(t,0.0,1.0);
    vec3 c;
    if(uPalette==0){ // fire & gold
        c = mix(vec3(0.05,0.0,0.0), vec3(1.0,0.85,0.3), pow(t,0.6));
        c = mix(c, vec3(1.0,0.4,0.05), 1.0-t);
    } else if(uPalette==1){ // ice
        c = mix(vec3(0.02,0.05,0.12), vec3(0.6,0.85,1.0), pow(t,0.7));
        c += 0.2*vec3(0.7,0.9,1.0)*trap;
    } else if(uPalette==2){ // aurora
        c = mix(vec3(0.0,0.1,0.05), vec3(0.2,1.0,0.6), t);
        c = mix(c, vec3(0.6,0.2,1.0), trap*0.8);
    } else if(uPalette==3){ // magenta nebula
        c = mix(vec3(0.1,0.0,0.2), vec3(1.0,0.3,0.9), pow(t,0.6));
        c += vec3(0.2,0.0,0.4)*trap;
    } else if(uPalette==4){ // emerald
        c = mix(vec3(0.0,0.05,0.02), vec3(0.3,1.0,0.5), pow(t,0.6));
        c = mix(c, vec3(1.0,0.9,0.4), pow(trap,2.0)*0.6);
    } else if(uPalette==5){ // sunset
        c = mix(vec3(0.15,0.02,0.2), vec3(1.0,0.5,0.2), t);
        c = mix(c, vec3(1.0,0.85,0.3), pow(t,3.0));
    } else if(uPalette==6){ // pearl mono
        c = vec3(pow(t,0.7));
        c = mix(c, vec3(0.95,0.92,1.0), 0.4);
    } else { // psychedelic
        c = 0.5+0.5*cos(6.283*(t+vec3(0.0,0.33,0.67))+trap*4.0);
    }
    return c;
}

vec3 lightColor(){
    if(uLightStyle==0) return vec3(1.0,0.92,0.78); // soft warm
    if(uLightStyle==1) return vec3(0.7,0.85,1.0);  // cold
    if(uLightStyle==2) return vec3(1.0,0.6,0.4);   // dramatic
    return vec3(1.0);                              // studio
}
vec3 fillColor(){
    if(uLightStyle==0) return vec3(0.25,0.3,0.45);
    if(uLightStyle==1) return vec3(0.3,0.35,0.5);
    if(uLightStyle==2) return vec3(0.15,0.18,0.35);
    return vec3(0.4,0.4,0.45);
}

void main(){
    vec2 uv = (gl_FragCoord.xy - 0.5*uRes)/uRes.y;

    // camera
    vec3 ro = uCamPos;
    vec3 ta = uCamTgt;
    vec3 ww = normalize(ta-ro);
    vec3 uu = normalize(cross(ww, vec3(0.0,1.0,0.0)));
    vec3 vv = cross(uu,ww);
    vec3 rd = normalize(uv.x*uu + uv.y*vv + 1.5*ww);

    // raymarch
    float t = 0.0;
    float trap=0.0, finalTrap=0.0;
    int hitIter=0;
    bool hit=false;
    for(int i=0;i<MAX_STEPS;i++){
        vec3 p = ro+rd*t;
        float tr;
        float d = DE(p,tr);
        if(d<MIN_DIST){ hit=true; finalTrap=tr; hitIter=i; break; }
        if(t>MAX_DIST) break;
        t += d*0.85;
    }

    vec3 col;
    if(hit){
        vec3 p = ro+rd*t;
        vec3 n = calcNormal(p);
        vec3 L = normalize(uLightDir);
        float diff = clamp(dot(n,L),0.0,1.0);
        float sh = softShadow(p+n*0.002, L, 16.0);
        float a = ao(p,n);
        vec3 H = normalize(L - rd);
        float spec = pow(clamp(dot(n,H),0.0,1.0), 32.0);
        float fres = pow(1.0-clamp(dot(n,-rd),0.0,1.0), 4.0);

        float trapN = clamp(sqrt(finalTrap),0.0,1.0);
        float depth = 1.0 - clamp(t/MAX_DIST,0.0,1.0);
        vec3 base = palette(depth*0.7 + 0.3*trapN, trapN);

        vec3 lc = lightColor()*uLightI;
        vec3 fc = fillColor();
        col = base*( fc*a*0.6 + lc*diff*sh );
        col += lc*spec*sh*0.8;
        col += fres*base*0.4;
        // emissive deep folds
        col += base*0.15*(1.0-a);

        // distance fog
        col = mix(col, vec3(0.02,0.02,0.04), pow(t/MAX_DIST,1.5));
    } else {
        // background gradient
        float g = 0.5+0.5*uv.y;
        col = mix(vec3(0.01,0.012,0.025), vec3(0.04,0.05,0.09), g);
        col += 0.04*palette(0.5+0.5*uv.x, 0.5);
    }

    // tonemap
    col = col/(1.0+col);
    col = pow(col, vec3(1.0/2.2));
    // vignette
    vec2 q = gl_FragCoord.xy/uRes;
    col *= 0.4 + 0.6*pow(16.0*q.x*q.y*(1.0-q.x)*(1.0-q.y),0.25);

    gl_FragColor = vec4(col,1.0);
}
</script>

<script>
const canvas = document.getElementById('c');
// ── Pointer & wheel controls (added for demo simplified version) ──
let _userYaw = null, _userPitch = 0.32, _userDist = 2.6;
let _dragging = false, _px = 0, _py = 0;
canvas.addEventListener('pointerdown', e => {
  _dragging = true; canvas.setPointerCapture(e.pointerId); _px = e.clientX; _py = e.clientY;
  if (_userYaw === null) { _userYaw = 0; } // initialise once user starts dragging
});
canvas.addEventListener('pointermove', e => {
  if (!_dragging || _userYaw === null) return;
  _userYaw += (e.clientX - _px) * 0.006;
  _userPitch = Math.max(-1.3, Math.min(1.3, _userPitch - (e.clientY - _py) * 0.006));
  _px = e.clientX; _py = e.clientY;
});
canvas.addEventListener('pointerup', e => { _dragging = false; try { canvas.releasePointerCapture(e.pointerId); } catch {} });
canvas.addEventListener('pointercancel', e => { _dragging = false; });
canvas.addEventListener('wheel', e => {
  if (_userYaw === null) _userYaw = 0;
  _userDist *= (1 + e.deltaY * 0.0015);
  _userDist = Math.max(1.4, Math.min(8, _userDist));
  e.preventDefault();
}, { passive: false });

const gl = canvas.getContext('webgl', {antialias:false, preserveDrawingBuffer:false});
if(!gl){ document.body.innerHTML='<p style="color:#f88;padding:20px">WebGL not supported</p>'; }

function compile(type, src){
    const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
    return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, document.getElementById('vert').textContent));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, document.getElementById('frag').textContent));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const buf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const pLoc=gl.getAttribLocation(prog,'p');
gl.enableVertexAttribArray(pLoc);
gl.vertexAttribPointer(pLoc,2,gl.FLOAT,false,0,0);

const U = {};
['uRes','uTime','uPower','uIter','uCamPos','uCamTgt','uLightDir','uLightI','uPalette','uLightStyle']
.forEach(n=> U[n]=gl.getUniformLocation(prog,n));

// UI elements
const $ = id=>document.getElementById(id);
const liVal=$('liVal'), laVal=$('laVal'), leVal=$('leVal'), rsVal=$('rsVal');
['lightI','lightA','lightE','resScale'].forEach(id=>{
    $(id).addEventListener('input',()=>{
        liVal.textContent=(+$('lightI').value).toFixed(2);
        laVal.textContent=$('lightA').value+'°';
        leVal.textContent=$('lightE').value+'°';
        rsVal.textContent=(+$('resScale').value).toFixed(2);
        resize();
    });
});

let startTime = performance.now();
$('restart').addEventListener('click',()=>{ startTime = performance.now(); });
$('toggle').addEventListener('click',()=>{
    const ui=$('ui');
    ui.style.display = ui.style.display==='none' ? 'block':'none';
    $('toggle').textContent = ui.style.display==='none' ? 'Show UI':'Hide UI';
});

function resize(){
    const scale = +$('resScale').value;
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    const w = Math.floor(window.innerWidth * dpr * scale);
    const h = Math.floor(window.innerHeight * dpr * scale);
    if(canvas.width!==w || canvas.height!==h){
        canvas.width=w; canvas.height=h;
    }
    gl.viewport(0,0,canvas.width,canvas.height);
}
window.addEventListener('resize',resize);
resize();

function render(){
    const tMs = performance.now() - startTime;
    const t = tMs/1000.0;

    const nStart = +$('nStart').value;
    const nEnd   = +$('nEnd').value;

    // Phase 1: 0..20s — formation at n=nStart, iterations grow 2→12
    // Phase 2: 20s..(20 + (nEnd-nStart)*1.2)s — n grows nStart→nEnd at full iter
    let power, iter, phase;
    const phase1Dur = 20.0;
    const phase2Dur = Math.max(8.0, Math.abs(nEnd-nStart)*1.2);
    if(t < phase1Dur){
        const u = t/phase1Dur;
        // smoothstep for cinematic build-up
        const s = u*u*(3.0-2.0*u);
        power = nStart;
        iter = Math.round(2 + s*10); // 2 → 12
        phase = `forming (iter=${iter})`;
    } else {
        const u = Math.min(1.0,(t-phase1Dur)/phase2Dur);
        const s = u*u*(3.0-2.0*u);
        power = nStart + (nEnd-nStart)*s;
        iter = 12;
        phase = `maturing n=${power.toFixed(2)}`;
        if(u>=1.0) phase = `mature @ n=${nEnd.toFixed(2)}`;
    }

    $('t').textContent = t.toFixed(1);
    $('nv').textContent = power.toFixed(2);
    $('ph').textContent = phase;

    // Camera: auto-orbit until user drags, then manual yaw/pitch/dist
    let cam;
    if (_userYaw === null) {
      const camR = 2.6;
      const camA = t*0.18;
      const camY = 0.4 + 0.25*Math.sin(t*0.13);
      cam = [Math.cos(camA)*camR, camY, Math.sin(camA)*camR];
    } else {
      const cy = Math.sin(_userPitch) * _userDist;
      const r = Math.cos(_userPitch) * _userDist;
      cam = [Math.cos(_userYaw) * r, cy, Math.sin(_userYaw) * r];
    }

    // Light direction from azimuth/elevation
    const az = (+$('lightA').value)*Math.PI/180;
    const el = (+$('lightE').value)*Math.PI/180;
    const ldir = [Math.cos(el)*Math.cos(az), Math.sin(el), Math.cos(el)*Math.sin(az)];

    gl.uniform2f(U.uRes, canvas.width, canvas.height);
    gl.uniform1f(U.uTime, t);
    gl.uniform1f(U.uPower, power);
    gl.uniform1i(U.uIter, iter);
    gl.uniform3f(U.uCamPos, cam[0],cam[1],cam[2]);
    gl.uniform3f(U.uCamTgt, 0,0,0);
    gl.uniform3f(U.uLightDir, ldir[0],ldir[1],ldir[2]);
    gl.uniform1f(U.uLightI, +$('lightI').value);
    gl.uniform1i(U.uPalette, +$('palette').value);
    gl.uniform1i(U.uLightStyle, +$('lightStyle').value);

    gl.drawArrays(gl.TRIANGLES,0,3);
    requestAnimationFrame(render);
}
render();
</script>
<div style="position:fixed;bottom:8px;right:10px;font-size:11px;color:#789;font-family:system-ui,sans-serif;background:rgba(0,0,0,.5);padding:4px 8px;border-radius:4px;pointer-events:none">Drag = rotate • Wheel = zoom</div>
</body>
</html>
