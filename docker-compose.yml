services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: codeforge-claude-db
    environment:
      POSTGRES_USER: codeforge
      POSTGRES_PASSWORD: codeforge_secret
      POSTGRES_DB: codeforge
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Sandbox for code execution (REST API service)
  sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    container_name: codeforge-claude-sandbox
    ports:
      - "8380:8080"
    environment:
      # Security limits
      MAX_EXECUTION_TIME: ${MAX_EXECUTION_TIME:-60}
      MAX_MEMORY_MB: ${MAX_MEMORY_MB:-512}
      SANDBOX_API_KEY: ${SANDBOX_API_KEY:-codeforge-sandbox-secret}
    # Resource limits for the sandbox container
    mem_limit: 2G
    cpus: 2
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codeforge-claude-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://codeforge:codeforge_secret@db:5432/codeforge
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # Sandbox service URL
      SANDBOX_URL: http://sandbox:8080
      SANDBOX_API_KEY: ${SANDBOX_API_KEY:-codeforge-sandbox-secret}
    ports:
      - "8300:8000"
    depends_on:
      db:
        condition: service_healthy
      sandbox:
        condition: service_healthy
    restart: unless-stopped
    # Run migrations on startup
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000
      "

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
        VITE_WS_URL: ""
    container_name: codeforge-claude-frontend
    ports:
      - "3300:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
