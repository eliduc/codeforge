<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mandelbulb 3D — Strange Attractor</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#eee;font-family:system-ui,sans-serif;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;position:absolute;top:0;left:0}
  #orbit{pointer-events:none;z-index:2}
  #c{z-index:1}
  #ui{position:fixed;top:10px;left:10px;background:rgba(15,15,25,.82);
      padding:12px 14px;border-radius:10px;backdrop-filter:blur(6px);
      max-width:320px;font-size:12px;z-index:10;border:1px solid #333;max-height:95vh;overflow:auto}
  #ui h3{margin:0 0 8px;font-size:13px;color:#9ff}
  #ui label{display:block;margin:6px 0 2px;color:#bbb}
  #ui input[type=range],#ui select,#ui input[type=number]{width:100%;background:#222;color:#eee;border:1px solid #444;border-radius:4px;box-sizing:border-box}
  #ui .row{display:flex;gap:6px}
  #ui .row>*{flex:1}
  button{background:#246;color:#fff;border:0;padding:6px 10px;border-radius:5px;cursor:pointer;margin-top:8px;width:100%}
  button:hover{background:#368}

  .preset button{margin:0;padding:4px 6px;font-size:11px}
  #info{position:fixed;bottom:10px;left:10px;font-size:12px;color:#9cf;background:rgba(0,0,0,.4);padding:6px 10px;border-radius:6px;z-index:10}
  #help{position:fixed;bottom:10px;right:10px;font-size:11px;color:#aaa;background:rgba(0,0,0,.4);padding:6px 10px;border-radius:6px;z-index:10;max-width:320px}
  #toggle{position:fixed;top:10px;right:10px;z-index:11;width:auto}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#200;color:#fcc;font-size:18px;z-index:99}
  hr{border:0;border-top:1px solid #333;margin:8px 0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="orbit"></canvas>
<button id="toggle">Hide UI</button>
<div id="ui">
  <h3>Mandelbulb Strange Attractor</h3>
  <div class="row">
    <div><label>n start</label><input id="nStart" type="number" value="4" step="1" min="2" max="30"></div>
    <div><label>n end</label><input id="nEnd" type="number" value="20" step="1" min="2" max="40"></div>
  </div>
  <label>Color palette</label>
  <select id="palette">
    <option value="0">1 — Fire &amp; Gold</option>
    <option value="1">2 — Ice Blue</option>
    <option value="2">3 — Aurora</option>

    <option value="4">5 — Emerald</option>
    <option value="5">6 — Sunset</option>

    <option value="7">8 — Psychedelic</option>
  </select>
  <label>Light style</label>
  <select id="lightStyle">
    <option value="0">Soft warm</option>
    <option value="1">Cold harsh</option>
    <option value="2">Dramatic rim</option>
    <option value="3">Studio</option>
  </select>
  <hr>
  <label>Key intensity <span id="liVal">1.4</span></label>
  <input id="lightI" type="range" min="0.2" max="3" step="0.05" value="1.4">
  <label>Fill intensity <span id="lfVal">0.6</span></label>
  <input id="lightF" type="range" min="0" max="2" step="0.05" value="0.6">
  <label>Rim intensity <span id="lrVal">0.5</span></label>
  <input id="lightR" type="range" min="0" max="2" step="0.05" value="0.5">
  <label>Shadow softness <span id="lsVal">16</span></label>
  <input id="lightS" type="range" min="2" max="64" step="1" value="16">
  <label>Key azimuth <span id="laVal">35°</span></label>
  <input id="lightA" type="range" min="0" max="360" step="1" value="35">
  <label>Key elevation <span id="leVal">45°</span></label>
  <input id="lightE" type="range" min="-30" max="89" step="1" value="45">
  <label>Fill azimuth <span id="la2Val">200°</span></label>
  <input id="lightA2" type="range" min="0" max="360" step="1" value="200">
  <label>Fill elevation <span id="le2Val">10°</span></label>
  <input id="lightE2" type="range" min="-30" max="89" step="1" value="10">
  <hr>
  <label>Resolution scale <span id="rsVal">0.85</span></label>
  <input id="resScale" type="range" min="0.4" max="2.0" step="0.05" value="0.85">
  <div class="preset">
    <button data-q="0.55">Low</button>
    <button data-q="0.85">Med</button>
    <button data-q="1.2">High</button>
    <button data-q="1.7">Ultra</button>
  </div>
  <label><input id="adaptQ" type="checkbox" checked style="width:auto"> Adaptive quality</label>
  <label><input id="showOrbits" type="checkbox" checked style="width:auto"> Show orbit trajectories</label>
  <label><input id="occlude" type="checkbox" checked style="width:auto"> Occlude orbits by surface</label>
  <button id="restart">⟳ Restart animation</button>
</div>
<div id="info">t=<span id="t">0.0</span>s &nbsp; n=<span id="nv">4.0</span> &nbsp; <span id="ph">forming</span></div>
<div id="help">Ray-marched Mandelbulb surface z↦z<sup>n</sup>+c (spherical power). Bright trails are bounded orbit trajectories — samples of the strange attractor — projected & depth-tested against the surface.</div>
<div id="err"></div>

<script id="vert" type="x-shader/x-vertex">
attribute vec2 p;
void main(){ gl_Position=vec4(p,0.0,1.0); }
</script>

<script id="frag" type="x-shader/x-fragment">
precision highp float;
uniform vec2 uRes;
uniform float uPower;
uniform int   uIter;
uniform int   uMaxSteps;
uniform vec3  uCamPos;
uniform vec3  uCamTgt;
uniform vec3  uLightDir;
uniform vec3  uLightDir2;
uniform vec3  uLightDir3;
uniform float uLightI;
uniform float uLightF;
uniform float uLightR;
uniform float uShadowK;
uniform int   uPalette;
uniform int   uLightStyle;

const int MAX_ITER = 24;
const float MAX_DIST = 8.0;
const float MIN_DIST = 0.0006;

float DE(vec3 pos, out float trap){
    vec3 z = pos;
    float dr = 1.0;
    float r = 0.0;
    trap = 1e10;
    float pwr = uPower;
    for(int i=0;i<MAX_ITER;i++){
        if(i>=uIter) break;
        r = length(z);
        if(r>2.0) break;
        if(r<1e-6) break;
        float theta = acos(clamp(z.z/r,-1.0,1.0));
        float phi   = atan(z.y, z.x);
        float rSafe = max(r, 1e-6);
        dr = pow(rSafe, pwr-1.0)*pwr*dr + 1.0;
        float zr = pow(rSafe, pwr);
        theta *= pwr; phi *= pwr;
        z = zr*vec3(sin(theta)*cos(phi), sin(theta)*sin(phi), cos(theta));
        z += pos;
        trap = min(trap, dot(z,z));
    }
    return 0.5*log(max(r,1e-6))*r/max(dr,1e-6);
}

vec3 calcNormal(vec3 p){
    float e=0.0012; float t;
    vec2 h = vec2(1.0,-1.0)*0.5773;
    return normalize( h.xyy*DE(p+h.xyy*e,t) +
                      h.yyx*DE(p+h.yyx*e,t) +
                      h.yxy*DE(p+h.yxy*e,t) +
                      h.xxx*DE(p+h.xxx*e,t) );
}

float softShadow(vec3 ro, vec3 rd, float k){
    float res = 1.0, t = 0.02, tr;
    for(int i=0;i<24;i++){
        float h = DE(ro+rd*t, tr);
        if(h<0.001) return 0.0;
        res = min(res, k*h/t);
        t += clamp(h,0.01,0.2);
        if(t>3.0) break;
    }
    return clamp(res,0.0,1.0);
}

float ao(vec3 p, vec3 n){
    float occ=0.0, sca=1.0, tr;
    for(int i=0;i<5;i++){
        float h = 0.01 + 0.12*float(i)/4.0;
        float d = DE(p+n*h, tr);
        occ += (h-d)*sca;
        sca *= 0.85;
    }
    return clamp(1.0-1.5*occ,0.0,1.0);
}

vec3 palette(float t, float trap){
    t = clamp(t,0.0,1.0);
    vec3 c;
    if(uPalette==0){
        c = mix(vec3(0.05,0.0,0.0), vec3(1.0,0.85,0.3), pow(t,0.6));
        c = mix(c, vec3(1.0,0.4,0.05), 1.0-t);
    } else if(uPalette==1){
        c = mix(vec3(0.02,0.05,0.12), vec3(0.6,0.85,1.0), pow(t,0.7));
        c += 0.2*vec3(0.7,0.9,1.0)*trap;
    } else if(uPalette==2){
        c = mix(vec3(0.0,0.1,0.05), vec3(0.2,1.0,0.6), t);
        c = mix(c, vec3(0.6,0.2,1.0), trap*0.8);
    } else if(uPalette==3){
        c = mix(vec3(0.1,0.0,0.2), vec3(1.0,0.3,0.9), pow(t,0.6));
        c += vec3(0.2,0.0,0.4)*trap;
    } else if(uPalette==4){
        c = mix(vec3(0.0,0.05,0.02), vec3(0.3,1.0,0.5), pow(t,0.6));
        c = mix(c, vec3(1.0,0.9,0.4), pow(trap,2.0)*0.6);
    } else if(uPalette==5){
        c = mix(vec3(0.15,0.02,0.2), vec3(1.0,0.5,0.2), t);
        c = mix(c, vec3(1.0,0.85,0.3), pow(t,3.0));
    } else if(uPalette==6){
        c = vec3(pow(t,0.7));
        c = mix(c, vec3(0.95,0.92,1.0), 0.4);
    } else {
        c = 0.5+0.5*cos(6.283*(t+vec3(0.0,0.33,0.67))+trap*4.0);
    }
    return c;
}

vec3 keyColor(){
    if(uLightStyle==0) return vec3(1.0,0.92,0.78);
    if(uLightStyle==1) return vec3(0.7,0.85,1.0);
    if(uLightStyle==2) return vec3(1.0,0.6,0.4);
    return vec3(1.0);
}
vec3 fillCol(){
    if(uLightStyle==0) return vec3(0.45,0.55,0.85);
    if(uLightStyle==1) return vec3(0.55,0.7,1.0);
    if(uLightStyle==2) return vec3(0.3,0.4,0.85);
    return vec3(0.7,0.75,0.8);
}
vec3 rimColor(){
    if(uLightStyle==0) return vec3(1.0,0.85,0.6);
    if(uLightStyle==1) return vec3(0.8,0.95,1.0);
    if(uLightStyle==2) return vec3(1.0,0.5,0.6);
    return vec3(1.0,1.0,0.95);
}

void main(){
    vec2 uv = (gl_FragCoord.xy - 0.5*uRes)/uRes.y;
    vec3 ro = uCamPos;
    vec3 ta = uCamTgt;
    vec3 ww = normalize(ta-ro);
    vec3 uu = normalize(cross(ww, vec3(0.0,1.0,0.0)));
    vec3 vv = cross(uu,ww);
    vec3 rd = normalize(uv.x*uu + uv.y*vv + 1.5*ww);

    float t = 0.0;
    float finalTrap=0.0;
    bool hit=false;
    for(int i=0;i<256;i++){
        if(i>=uMaxSteps) break;
        vec3 p = ro+rd*t;
        float tr;
        float d = DE(p,tr);
        if(d<MIN_DIST){ hit=true; finalTrap=tr; break; }
        if(t>MAX_DIST) break;
        t += d*0.85;
    }

    vec3 col;
    float depthOut = MAX_DIST;
    if(hit){
        depthOut = t;
        vec3 p = ro+rd*t;
        vec3 n = calcNormal(p);
        vec3 L1 = normalize(uLightDir);
        vec3 L2 = normalize(uLightDir2);
        vec3 L3 = normalize(uLightDir3);
        float diff1 = clamp(dot(n,L1),0.0,1.0);
        float diff2 = clamp(dot(n,L2),0.0,1.0);
        float diff3 = clamp(dot(n,L3),0.0,1.0);
        float sh = softShadow(p+n*0.002, L1, uShadowK);
        float a = ao(p,n);
        vec3 H = normalize(L1 - rd);
        float spec = pow(clamp(dot(n,H),0.0,1.0), 32.0);
        float fres = pow(1.0-clamp(dot(n,-rd),0.0,1.0), 4.0);

        float trapN = clamp(sqrt(finalTrap),0.0,1.0);
        float depth = 1.0 - clamp(t/MAX_DIST,0.0,1.0);
        vec3 base = palette(depth*0.7 + 0.3*trapN, trapN);

        vec3 kc = keyColor()*uLightI;
        vec3 fc = fillCol()*uLightF;
        vec3 rc = rimColor()*uLightR;
        col = base*( fc*a*(0.4+0.6*diff2) + kc*diff1*sh );
        col += kc*spec*sh*0.8;
        col += rc*diff3*fres*1.2;
        col += fres*base*0.4;
        col += base*0.15*a;
        col = mix(col, vec3(0.02,0.02,0.04), pow(t/MAX_DIST,1.5));
    } else {
        float g = 0.5+0.5*uv.y;
        col = mix(vec3(0.01,0.012,0.025), vec3(0.04,0.05,0.09), g);
        col += 0.04*palette(0.5+0.5*uv.x, 0.5);
    }

    col = col/(1.0+col);
    col = pow(col, vec3(1.0/2.2));
    vec2 q = gl_FragCoord.xy/uRes;
    col *= 0.4 + 0.6*pow(16.0*q.x*q.y*(1.0-q.x)*(1.0-q.y),0.25);

    // Encode depth in alpha (0..1 normalized over MAX_DIST)
    gl_FragColor = vec4(col, depthOut/MAX_DIST);
}
</script>

<script>
(function(){
const $ = id=>document.getElementById(id);
function showErr(msg){ const e=$('err'); e.style.display='flex'; e.textContent=msg; }

const canvas = $('c');
let gl = canvas.getContext('webgl', {antialias:true, powerPreference:'high-performance', alpha:true, premultipliedAlpha:false});
if(!gl){ showErr('WebGL not supported'); return; }

function compile(type,src){
    const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){ showErr('shader err'); throw new Error(gl.getShaderInfoLog(s)); }
    return s;
}
const prog=gl.createProgram();
gl.attachShader(prog,compile(gl.VERTEX_SHADER,$('vert').textContent));
gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,$('frag').textContent));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS)){ showErr('link err'); return; }
gl.useProgram(prog);

const buf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const pLoc=gl.getAttribLocation(prog,'p');
gl.enableVertexAttribArray(pLoc);
gl.vertexAttribPointer(pLoc,2,gl.FLOAT,false,0,0);

const U={};
['uRes','uPower','uIter','uMaxSteps','uCamPos','uCamTgt','uLightDir','uLightDir2','uLightDir3',
 'uLightI','uLightF','uLightR','uShadowK','uPalette','uLightStyle'].forEach(n=>U[n]=gl.getUniformLocation(prog,n));

const State={
    nStart:4,nEnd:20,palette:0,lightStyle:0,
    lightI:1.4,lightF:0.6,lightR:0.5,lightS:16,
    lightA:35,lightE:45,lightA2:200,lightE2:10,
    resScale:0.85,showOrbits:true,adaptQ:true,occlude:true
};
function safeNum(v,fb){const n=+v;return isFinite(n)?n:fb;}

function syncUI(){
    State.palette=+$('palette').value|0;
    State.lightStyle=+$('lightStyle').value|0;
    State.lightI=safeNum($('lightI').value,1.4);
    State.lightF=safeNum($('lightF').value,0.6);
    State.lightR=safeNum($('lightR').value,0.5);
    State.lightS=safeNum($('lightS').value,16);
    State.lightA=safeNum($('lightA').value,35);
    State.lightE=safeNum($('lightE').value,45);
    State.lightA2=safeNum($('lightA2').value,200);
    State.lightE2=safeNum($('lightE2').value,10);
    State.resScale=safeNum($('resScale').value,0.85);
    State.showOrbits=$('showOrbits').checked;
    State.adaptQ=$('adaptQ').checked;
    State.occlude=$('occlude').checked;
    $('liVal').textContent=State.lightI.toFixed(2);
    $('lfVal').textContent=State.lightF.toFixed(2);
    $('lrVal').textContent=State.lightR.toFixed(2);
    $('lsVal').textContent=State.lightS.toFixed(0);
    $('laVal').textContent=State.lightA.toFixed(0)+'°';
    $('leVal').textContent=State.lightE.toFixed(0)+'°';
    $('la2Val').textContent=State.lightA2.toFixed(0)+'°';
    $('le2Val').textContent=State.lightE2.toFixed(0)+'°';
    $('rsVal').textContent=State.resScale.toFixed(2);
}
['palette','lightStyle','lightI','lightF','lightR','lightS','lightA','lightE','lightA2','lightE2','showOrbits','adaptQ','occlude'].forEach(id=>{
    $(id).addEventListener('input',syncUI);
    $(id).addEventListener('change',syncUI);
});
$('resScale').addEventListener('input',()=>{syncUI();resize();});
document.querySelectorAll('.preset button').forEach(b=>{
    b.addEventListener('click',()=>{ $('resScale').value=b.dataset.q; syncUI(); resize(); });
});

let startTime=performance.now();
let currentPowerForOrbits=4;

function applyRestart(){
    let s=Math.max(2,Math.min(30,Math.round(safeNum($('nStart').value,4))));
    let e=Math.max(2,Math.min(40,Math.round(safeNum($('nEnd').value,20))));
    if(e<s)e=s;
    State.nStart=s; State.nEnd=e;
    $('nStart').value=s; $('nEnd').value=e;
    startTime=performance.now();
    currentPowerForOrbits=s;
    resetOrbits(s);
}
$('restart').addEventListener('click',applyRestart);
$('toggle').addEventListener('click',()=>{
    const ui=$('ui');
    ui.style.display=ui.style.display==='none'?'block':'none';
    $('toggle').textContent=ui.style.display==='none'?'Show UI':'Hide UI';
});

const orbitCanvas=$('orbit');
const octx=orbitCanvas.getContext('2d');
if(!octx){ showErr('2D ctx unavailable'); return; }
let dprCached=1;

// Depth buffer read for occlusion: capture WebGL canvas pixels
let depthReadPx=null;
let depthReadW=0,depthReadH=0;

function resize(){
    const scale=State.resScale;
    const dpr=Math.min(window.devicePixelRatio||1,2);
    dprCached=dpr;
    const w=Math.floor(window.innerWidth*dpr*scale);
    const h=Math.floor(window.innerHeight*dpr*scale);
    if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}
    gl.viewport(0,0,canvas.width,canvas.height);
    const ow=Math.floor(window.innerWidth*dpr);
    const oh=Math.floor(window.innerHeight*dpr);
    if(orbitCanvas.width!==ow||orbitCanvas.height!==oh){orbitCanvas.width=ow;orbitCanvas.height=oh;}
    orbitCanvas.style.width=window.innerWidth+'px';
    orbitCanvas.style.height=window.innerHeight+'px';
}
window.addEventListener('resize',resize);

const NUM_ORBITS=56;
const TRAIL_MAX=180;
let orbits=[];

function makeOrbit(idx,n){
    for(let tries=0;tries<30;tries++){
        const u=Math.random()*Math.PI*2;
        const v=Math.acos(2*Math.random()-1);
        const r=0.3+Math.random()*0.55;
        const c=[r*Math.sin(v)*Math.cos(u),r*Math.sin(v)*Math.sin(u),r*Math.cos(v)];
        let x=0,y=0,z=0,bounded=true;
        for(let i=0;i<25;i++){
            const rr=Math.sqrt(x*x+y*y+z*z);
            if(rr>2){bounded=false;break;}
            if(rr<1e-8){x=c[0];y=c[1];z=c[2];continue;}
            const theta=Math.acos(z/rr),phi=Math.atan2(y,x);
            const zr=Math.pow(rr,n),t2=theta*n,p2=phi*n;
            x=zr*Math.sin(t2)*Math.cos(p2)+c[0];
            y=zr*Math.sin(t2)*Math.sin(p2)+c[1];
            z=zr*Math.cos(t2)+c[2];
        }
        if(bounded) return {c,z:[0,0,0],trail:[],alive:true,hue:idx/NUM_ORBITS};
    }
    return {c:[0.3,0.2,0.1],z:[0,0,0],trail:[],alive:true,hue:idx/NUM_ORBITS};
}
function resetOrbits(n){orbits=[];for(let i=0;i<NUM_ORBITS;i++)orbits.push(makeOrbit(i,n));}

function stepOrbit(o,n){
    if(!o.alive)return;
    let[x,y,z]=o.z;
    const r=Math.sqrt(x*x+y*y+z*z);
    if(r>2){o.alive=false;return;}
    let nx,ny,nz;
    if(r<1e-8){nx=o.c[0];ny=o.c[1];nz=o.c[2];}
    else{
        const theta=Math.acos(Math.max(-1,Math.min(1,z/r)));
        const phi=Math.atan2(y,x);
        const zr=Math.pow(r,n),t2=theta*n,p2=phi*n;
        nx=zr*Math.sin(t2)*Math.cos(p2)+o.c[0];
        ny=zr*Math.sin(t2)*Math.sin(p2)+o.c[1];
        nz=zr*Math.cos(t2)+o.c[2];
    }
    o.z=[nx,ny,nz];
    o.trail.push(nx,ny,nz);
    if(o.trail.length>TRAIL_MAX*3)o.trail.splice(0,3);
}

function sub(a,b){return[a[0]-b[0],a[1]-b[1],a[2]-b[2]];}
function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}
function cross(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}
function norm(a){const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l];}

let _basis=null;
function setupBasis(cam,tgt){
    const ww=norm(sub(tgt,cam));
    const uu=norm(cross(ww,[0,1,0]));
    const vv=cross(uu,ww);
    _basis={cam,ww,uu,vv};
}
function project(p,w,h){
    const d=sub(p,_basis.cam);
    const x=dot(d,_basis.uu),y=dot(d,_basis.vv),zc=dot(d,_basis.ww);
    if(zc<=0.05)return null;
    const sx=(x/zc)*1.5,sy=(y/zc)*1.5;
    return[w/2+sx*h,h/2-sy*h,zc];
}

// Palette colors in JS for orbits (match shader paletteId)
function paletteJS(pid,t){
    t=Math.max(0,Math.min(1,t));
    const mix=(a,b,k)=>[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k,a[2]+(b[2]-a[2])*k];
    if(pid===0) return mix([1,0.4,0.05],[1,0.9,0.4],t);
    if(pid===1) return mix([0.4,0.7,1],[0.85,0.95,1],t);
    if(pid===2) return mix([0.2,1,0.6],[0.6,0.3,1],t);
    if(pid===3) return mix([1,0.3,0.9],[0.6,0.4,1],t);
    if(pid===4) return mix([0.3,1,0.5],[1,0.9,0.4],t);
    if(pid===5) return mix([1,0.5,0.2],[1,0.85,0.3],t);
    if(pid===6) return mix([0.7,0.7,0.8],[1,1,1],t);
    // psychedelic
    return [0.5+0.5*Math.cos(6.28*(t)),0.5+0.5*Math.cos(6.28*(t+0.33)),0.5+0.5*Math.cos(6.28*(t+0.67))];
}

let orbitAccum=0;
const ORBIT_DT=1/60;
function simulateOrbits(dt,n){
    orbitAccum+=dt;
    let steps=Math.floor(orbitAccum/ORBIT_DT);
    if(steps>10)steps=10;
    orbitAccum-=steps*ORBIT_DT;
    for(let s=0;s<steps;s++){
        for(let i=0;i<orbits.length;i++){
            const o=orbits[i];
            if(!o.alive){orbits[i]=makeOrbit(i,n);continue;}
            stepOrbit(o,n);
        }
    }
}

const MAX_DIST=8.0;
// Sample depth from rendered WebGL pixels (alpha channel stores normalized depth)
function sampleDepth(px,py){
    if(!depthReadPx||!State.occlude) return MAX_DIST;
    // orbit canvas coords -> webgl canvas coords
    const sx=Math.floor(px*(depthReadW/orbitCanvas.width));
    const sy=Math.floor(py*(depthReadH/orbitCanvas.height));
    if(sx<0||sy<0||sx>=depthReadW||sy>=depthReadH) return MAX_DIST;
    // gl pixels are bottom-up
    const flipY=depthReadH-1-sy;
    const idx=(flipY*depthReadW+sx)*4+3;
    const a=depthReadPx[idx]/255;
    if(a>=0.999) return MAX_DIST; // background
    return a*MAX_DIST;
}

function drawOrbits(){
    const w=orbitCanvas.width,h=orbitCanvas.height;
    octx.clearRect(0,0,w,h);
    if(!State.showOrbits)return;
    octx.globalCompositeOperation='lighter';
    octx.lineCap='round';
    const lwBase=1.3*dprCached;
    for(const o of orbits){
        const trail=o.trail;
        const nP=trail.length/3;
        if(nP<2)continue;
        const rgb=paletteJS(State.palette,o.hue);
        const colStr=`${(rgb[0]*255)|0},${(rgb[1]*255)|0},${(rgb[2]*255)|0}`;
        let prev=null,prevVis=false;
        for(let i=0;i<nP;i++){
            const f=i/(nP-1);
            const pr=project([trail[i*3],trail[i*3+1],trail[i*3+2]],w,h);
            let visible=false;
            if(pr){
                const sd=sampleDepth(pr[0],pr[1]);
                visible = pr[2] < sd + 0.02; // small bias
            }
            if(pr && prev && visible && prevVis){
                octx.strokeStyle=`rgba(${colStr},${0.15+0.75*f})`;
                octx.lineWidth=lwBase*(0.35+0.9*f);
                octx.beginPath();
                octx.moveTo(prev[0],prev[1]);
                octx.lineTo(pr[0],pr[1]);
                octx.stroke();
            }
            prev=pr; prevVis=visible;
        }
        const lx=trail[trail.length-3],ly=trail[trail.length-2],lz=trail[trail.length-1];
        const pr=project([lx,ly,lz],w,h);
        if(pr && o.alive){
            const sd=sampleDepth(pr[0],pr[1]);
            if(pr[2] < sd + 0.02){
                const rad=9*dprCached;
                const rgb2=paletteJS(State.palette,(o.hue+0.1)%1);
                const grd=octx.createRadialGradient(pr[0],pr[1],0,pr[0],pr[1],rad);
                grd.addColorStop(0,`rgba(${(rgb2[0]*255)|0},${(rgb2[1]*255)|0},${(rgb2[2]*255)|0},0.95)`);
                grd.addColorStop(1,'rgba(0,0,0,0)');
                octx.fillStyle=grd;
                octx.beginPath(); octx.arc(pr[0],pr[1],rad,0,Math.PI*2); octx.fill();
            }
        }
    }
}

syncUI(); applyRestart(); resize();

let frameAvg=16,lastFrame=performance.now();
let adaptCooldown=0,infoUpdateAccum=0;

function computeTimeline(t){
    const phase1Dur=20.0;
    const HOLD=4.0;       // longer hold so each mature n is appreciable
    const MORPH=1.5;
    const matureIter=20;
    if(t<phase1Dur){
        const u=t/phase1Dur;
        const s=u*u*(3.0-2.0*u);
        const it=Math.round(3+s*(matureIter-3));
        return {power:State.nStart,iter:it,phase:`forming attractor (iter=${it})`};
    }
    let tt=t-phase1Dur;
    const steps=Math.max(0,State.nEnd-State.nStart);
    if(steps===0) return {power:State.nStart,iter:matureIter,phase:`mature @ n=${State.nStart}`};
    const cyc=MORPH+HOLD;
    let idx=Math.floor(tt/cyc);
    if(idx>=steps) return {power:State.nEnd,iter:matureIter,phase:`mature @ n=${State.nEnd} (final)`};
    const lt=tt-idx*cyc;
    const f=State.nStart+idx, to=State.nStart+idx+1;
    if(lt<MORPH){
        const u=lt/MORPH;const s=u*u*(3.0-2.0*u);
        return {power:f+(to-f)*s,iter:matureIter,phase:`morphing n=${f}→${to}`};
    }
    return {power:to,iter:matureIter,phase:`mature @ n=${to}`};
}

function render(){
    const now=performance.now();
    let dt=(now-lastFrame)/1000;
    if(dt>0.1)dt=0.1;
    lastFrame=now;
    frameAvg=frameAvg*0.92+dt*1000*0.08;

    if(State.adaptQ && adaptCooldown<=0){
        if(frameAvg>55 && State.resScale>0.5){
            State.resScale=Math.max(0.5,State.resScale-0.1);
            $('resScale').value=State.resScale; $('rsVal').textContent=State.resScale.toFixed(2);
            resize(); adaptCooldown=90;
        } else if(frameAvg<22 && State.resScale<1.6){
            State.resScale=Math.min(1.6,State.resScale+0.05);
            $('resScale').value=State.resScale; $('rsVal').textContent=State.resScale.toFixed(2);
            resize(); adaptCooldown=180;
        }
    }
    if(adaptCooldown>0)adaptCooldown--;

    const t=(now-startTime)/1000.0;
    const tl=computeTimeline(t);
    const newInt=Math.round(tl.power);
    if(Math.abs(newInt-currentPowerForOrbits)>=1 && Math.abs(tl.power-newInt)<0.05){
        currentPowerForOrbits=newInt; resetOrbits(newInt); orbitAccum=0;
    }
    simulateOrbits(dt,tl.power);

    infoUpdateAccum+=dt;
    if(infoUpdateAccum>0.15){
        infoUpdateAccum=0;
        $('t').textContent=t.toFixed(1);
        $('nv').textContent=tl.power.toFixed(2);
        $('ph').textContent=tl.phase;
    }

    const camR=2.6;
    const camA=t*0.18;
    const camY=0.4+0.25*Math.sin(t*0.13);
    const cam=[Math.cos(camA)*camR,camY,Math.sin(camA)*camR];

    const az=State.lightA*Math.PI/180,el=State.lightE*Math.PI/180;
    const ldir=[Math.cos(el)*Math.cos(az),Math.sin(el),Math.cos(el)*Math.sin(az)];
    const az2=State.lightA2*Math.PI/180,el2=State.lightE2*Math.PI/180;
    const ldir2=[Math.cos(el2)*Math.cos(az2),Math.sin(el2),Math.cos(el2)*Math.sin(az2)];
    // Rim light: opposite-back from key
    const az3=az+Math.PI,el3=Math.max(-0.1,el*0.4);
    const ldir3=[Math.cos(el3)*Math.cos(az3),Math.sin(el3),Math.cos(el3)*Math.sin(az3)];

    // dynamic step count: based on resolution scale to keep perf
    const maxSteps = State.resScale>1.2? 180 : (State.resScale>0.7? 140 : 100);

    gl.uniform2f(U.uRes,canvas.width,canvas.height);
    gl.uniform1f(U.uPower,tl.power);
    gl.uniform1i(U.uIter,tl.iter);
    gl.uniform1i(U.uMaxSteps,maxSteps);
    gl.uniform3f(U.uCamPos,cam[0],cam[1],cam[2]);
    gl.uniform3f(U.uCamTgt,0,0,0);
    gl.uniform3f(U.uLightDir,ldir[0],ldir[1],ldir[2]);
    gl.uniform3f(U.uLightDir2,ldir2[0],ldir2[1],ldir2[2]);
    gl.uniform3f(U.uLightDir3,ldir3[0],ldir3[1],ldir3[2]);
    gl.uniform1f(U.uLightI,State.lightI);
    gl.uniform1f(U.uLightF,State.lightF);
    gl.uniform1f(U.uLightR,State.lightR);
    gl.uniform1f(U.uShadowK,State.lightS);
    gl.uniform1i(U.uPalette,State.palette);
    gl.uniform1i(U.uLightStyle,State.lightStyle);

    gl.drawArrays(gl.TRIANGLES,0,3);

    // read depth pixels at reduced resolution for occlusion (every frame; downsample)
    if(State.occlude && State.showOrbits){
        const tw=Math.min(320,canvas.width), th=Math.min(200,canvas.height);
        // sample at canvas resolution for simplicity
        const rw=canvas.width, rh=canvas.height;
        if(!depthReadPx || depthReadW!==rw || depthReadH!==rh){
            depthReadPx=new Uint8Array(rw*rh*4);
            depthReadW=rw; depthReadH=rh;
        }
        gl.readPixels(0,0,rw,rh,gl.RGBA,gl.UNSIGNED_BYTE,depthReadPx);
    }

    setupBasis(cam,[0,0,0]);
    drawOrbits();

    requestAnimationFrame(render);
}
render();
})();
</script>
</body>
