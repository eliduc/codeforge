<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flow Field — Generative Particles</title>
<style>
  html,body{margin:0;height:100%;background:#05030a;color:#eee;font-family:system-ui,sans-serif;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh}
  #panel{position:fixed;top:16px;left:16px;padding:14px 16px;background:rgba(10,8,20,.55);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(10px);border-radius:14px;font-size:12px;color:#cbd;line-height:1.6;z-index:10;max-width:280px}
  #panel h1{margin:0 0 6px;font-size:14px;letter-spacing:.06em;text-transform:uppercase;background:linear-gradient(90deg,#ff5fa2,#5fbcff);-webkit-background-clip:text;background-clip:text;color:transparent}
  #panel label{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
  #panel input[type=range]{flex:1;accent-color:#ff5fa2}
  #panel button{margin-top:10px;width:100%;padding:8px;border:none;border-radius:8px;background:linear-gradient(135deg,#ff5fa2,#5fbcff);color:#05030a;font-weight:700;cursor:pointer}
  #panel .v{font-variant-numeric:tabular-nums;color:#fff;min-width:34px;text-align:right}
  #hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);font-size:11px;color:rgba(255,255,255,.45);letter-spacing:.06em;text-transform:uppercase}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <h1>Flow Field</h1>
  <div style="opacity:.7">Curl-noise particle system</div>
  <label>Particles <input id="count" type="range" min="500" max="6000" step="100" value="2500"><span class="v" id="vCount">2500</span></label>
  <label>Speed <input id="speed" type="range" min="0.2" max="2.5" step="0.05" value="1"><span class="v" id="vSpeed">1.00</span></label>
  <label>Curl <input id="curl" type="range" min="0.001" max="0.012" step="0.0005" value="0.004"><span class="v" id="vCurl">0.004</span></label>
  <label>Fade <input id="fade" type="range" min="0" max="0.25" step="0.005" value="0.04"><span class="v" id="vFade">0.04</span></label>
  <label>Palette
    <select id="pal" style="background:#13101c;color:#eee;border:1px solid #2c2640;border-radius:6px;padding:3px">
      <option value="0">Aurora</option><option value="1">Sunset</option><option value="2">Magma</option><option value="3">Ocean</option><option value="4">Mono</option>
    </select>
  </label>
  <button id="reset">Reset</button>
</div>
<div id="hint">drag to disturb · double-click to clear</div>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0;function size(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio;}
size();addEventListener('resize',size);

// Simplex-ish noise (2D value-noise w/ smoothing — cheap & adequate)
const perm=new Uint8Array(512);for(let i=0;i<256;i++)perm[i]=i;
for(let i=255;i>0;i--){const j=(Math.random()*(i+1))|0;[perm[i],perm[j]]=[perm[j],perm[i]]}
for(let i=0;i<256;i++)perm[i+256]=perm[i];
function fade(t){return t*t*t*(t*(t*6-15)+10)}
function grad(h,x,y){const u=h&1?-x:x,v=h&2?-y:y;return u+v}
function noise(x,y){
  const X=Math.floor(x)&255,Y=Math.floor(y)&255;x-=Math.floor(x);y-=Math.floor(y);
  const u=fade(x),v=fade(y);
  const A=perm[X]+Y,B=perm[X+1]+Y;
  return (1+(
    (1-v)*((1-u)*grad(perm[A],x,y)+u*grad(perm[B],x-1,y))+
    v*((1-u)*grad(perm[A+1],x,y-1)+u*grad(perm[B+1],x-1,y-1))
  ))*0.5;
}

const palettes=[
  [[255,95,162],[124,92,255],[95,188,255],[44,235,200]],
  [[255,182,84],[255,99,109],[160,72,196],[60,40,120]],
  [[255,240,180],[255,140,40],[200,40,40],[60,10,30]],
  [[60,210,230],[60,140,230],[80,80,220],[20,30,90]],
  [[235,235,240],[170,170,180],[100,100,110],[30,30,40]],
];

let particles=[],opts={count:2500,speed:1,curl:0.004,fade:0.04,palette:0};
function makeParticles(n){
  particles=[];for(let i=0;i<n;i++)particles.push({x:Math.random()*W,y:Math.random()*H,age:Math.random()*200,seed:Math.random()})
}
makeParticles(opts.count);

function colorFor(p){
  const pal=palettes[opts.palette],t=(p.seed+p.age*.002)%1;
  const idx=t*(pal.length-1),i=idx|0,f=idx-i;
  const a=pal[i],b=pal[Math.min(i+1,pal.length-1)];
  return [a[0]+(b[0]-a[0])*f|0,a[1]+(b[1]-a[1])*f|0,a[2]+(b[2]-a[2])*f|0];
}

let mouse=null;cv.addEventListener('pointerdown',e=>{mouse={x:e.clientX*devicePixelRatio,y:e.clientY*devicePixelRatio}});
cv.addEventListener('pointermove',e=>{if(mouse){mouse.x=e.clientX*devicePixelRatio;mouse.y=e.clientY*devicePixelRatio}});
addEventListener('pointerup',()=>{mouse=null});
cv.addEventListener('dblclick',()=>{ctx.fillStyle='#05030a';ctx.fillRect(0,0,W,H);makeParticles(opts.count)});

let t0=0;
function step(){
  requestAnimationFrame(step);t0+=0.003;
  ctx.fillStyle='rgba(5,3,10,'+opts.fade+')';ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  for(const p of particles){
    const nx=p.x*opts.curl,ny=p.y*opts.curl;
    const ang=noise(nx,ny+t0)*Math.PI*4;
    const vx=Math.cos(ang)*opts.speed*1.4,vy=Math.sin(ang)*opts.speed*1.4;
    let dvx=0,dvy=0;
    if(mouse){const dx=p.x-mouse.x,dy=p.y-mouse.y,d=Math.hypot(dx,dy);if(d<160*devicePixelRatio){const f=(160*devicePixelRatio-d)/160/devicePixelRatio;dvx=(dx/d)*f*4;dvy=(dy/d)*f*4}}
    p.x+=vx+dvx;p.y+=vy+dvy;p.age++;
    if(p.x<0||p.x>W||p.y<0||p.y>H||p.age>400){p.x=Math.random()*W;p.y=Math.random()*H;p.age=0}
    const c=colorFor(p),a=.55;
    ctx.fillStyle='rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';
    ctx.fillRect(p.x,p.y,1.6*devicePixelRatio,1.6*devicePixelRatio);
  }
  ctx.globalCompositeOperation='source-over';
}
requestAnimationFrame(step);

const $=id=>document.getElementById(id);
function bind(id,key,fmt=v=>v){$(id).oninput=e=>{const v=parseFloat(e.target.value);opts[key]=v;$('v'+id[0].toUpperCase()+id.slice(1)).textContent=fmt(v)}}
bind('count','count',v=>v|0);bind('speed','speed',v=>v.toFixed(2));bind('curl','curl',v=>v.toFixed(3));bind('fade','fade',v=>v.toFixed(2));
$('count').addEventListener('change',()=>makeParticles(opts.count));
$('pal').onchange=e=>{opts.palette=parseInt(e.target.value)};
$('reset').onclick=()=>{ctx.fillStyle='#05030a';ctx.fillRect(0,0,W,H);makeParticles(opts.count)};
})();
</script>
</body>
</html>
