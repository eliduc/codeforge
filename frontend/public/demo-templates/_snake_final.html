<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Snake</title>
<style>
  html,body{margin:0;height:100%;background:#0a0a14;color:#eee;font-family:system-ui,sans-serif;overflow:hidden;display:flex;align-items:center;justify-content:center}
  #wrap{position:relative;width:min(90vmin,640px);height:min(90vmin,640px)}
  canvas{width:100%;height:100%;display:block;border-radius:14px;box-shadow:0 0 40px rgba(0,255,200,.25),inset 0 0 30px rgba(0,255,200,.08);background:radial-gradient(circle at center,#0c1024,#04060c)}
  #hud{position:absolute;top:14px;left:18px;right:18px;display:flex;justify-content:space-between;font-weight:700;letter-spacing:.04em;font-size:14px;text-transform:uppercase;color:#7ef0d4;text-shadow:0 0 10px #1ce6b5}
  #score{color:#fff}
  #msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(4,6,14,.78);backdrop-filter:blur(6px);border-radius:14px;transition:opacity .3s}
  #msg.hidden{opacity:0;pointer-events:none}
  #msg h1{font-size:42px;margin:0 0 8px;background:linear-gradient(90deg,#1ce6b5,#7c5cff);-webkit-background-clip:text;background-clip:text;color:transparent}
  #msg p{margin:6px 0;color:#bcd;font-size:14px}
  #msg kbd{background:#1a1f33;border:1px solid #2f3a5a;border-radius:6px;padding:2px 8px;font-family:monospace;color:#7ef0d4}
  #msg button{margin-top:18px;padding:10px 28px;font-size:16px;font-weight:700;border:none;border-radius:10px;background:linear-gradient(135deg,#1ce6b5,#7c5cff);color:#04060c;cursor:pointer;box-shadow:0 6px 24px rgba(124,92,255,.4)}
  #msg button:hover{transform:translateY(-1px)}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud"><span>Neon Snake</span><span id="score">0</span></div>
  <div id="msg">
    <h1>Neon Snake</h1>
    <p>Arrow keys or <kbd>WASD</kbd> to move</p>
    <p>Eat the glowing pellets. Don't hit yourself.</p>
    <button id="play">Play</button>
  </div>
</div>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const msg=document.getElementById('msg'),scoreEl=document.getElementById('score'),btn=document.getElementById('play');
const N=22; // grid size
let snake,dir,nextDir,food,score,alive,particles,trail,grow,tick;
function size(){const r=cv.getBoundingClientRect();cv.width=r.width*devicePixelRatio;cv.height=r.height*devicePixelRatio;}
size();addEventListener('resize',size);
function reset(){
  snake=[{x:11,y:11},{x:10,y:11},{x:9,y:11}];
  dir={x:1,y:0};nextDir=dir;score=0;alive=true;particles=[];trail=[];grow=0;tick=0;
  placeFood();updateScore();
}
function placeFood(){let p;do{p={x:(Math.random()*N|0),y:(Math.random()*N|0)}}while(snake.some(s=>s.x===p.x&&s.y===p.y));food=p;}
function updateScore(){scoreEl.textContent=score.toString().padStart(3,'0');}
function burst(x,y,color){for(let i=0;i<20;i++){const a=Math.random()*Math.PI*2,s=2+Math.random()*4;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:30+Math.random()*20,color})}}
function step(){
  dir=nextDir;
  const head={x:(snake[0].x+dir.x+N)%N,y:(snake[0].y+dir.y+N)%N};
  if(snake.some(s=>s.x===head.x&&s.y===head.y)){alive=false;burst(head.x,head.y,'#ff3a6e');setTimeout(showGameOver,400);return;}
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){score++;grow+=2;burst(food.x,food.y,'#ffd166');placeFood();updateScore();}
  if(grow>0)grow--;else snake.pop();
  trail.push({x:head.x,y:head.y,life:18});
}
function showGameOver(){msg.querySelector('h1').textContent='Game Over';msg.querySelector('p').textContent='Score '+score;btn.textContent='Restart';msg.classList.remove('hidden');alive=false;}
function draw(){
  const W=cv.width,H=cv.height,cell=Math.min(W,H)/N;
  ctx.fillStyle='rgba(4,6,14,.35)';ctx.fillRect(0,0,W,H);
  // grid
  ctx.strokeStyle='rgba(124,92,255,.06)';ctx.lineWidth=1;
  for(let i=0;i<=N;i++){ctx.beginPath();ctx.moveTo(i*cell,0);ctx.lineTo(i*cell,N*cell);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*cell);ctx.lineTo(N*cell,i*cell);ctx.stroke();}
  // trail glow
  for(const t of trail){const a=t.life/18;ctx.fillStyle='rgba(28,230,181,'+a*.18+')';ctx.fillRect(t.x*cell,t.y*cell,cell,cell);t.life--;}
  trail=trail.filter(t=>t.life>0);
  // food
  const fx=food.x*cell+cell/2,fy=food.y*cell+cell/2,fr=cell*.35,pulse=1+Math.sin(tick/8)*.18;
  const g=ctx.createRadialGradient(fx,fy,0,fx,fy,fr*4);g.addColorStop(0,'rgba(255,209,102,1)');g.addColorStop(.3,'rgba(255,128,80,.6)');g.addColorStop(1,'rgba(255,128,80,0)');
  ctx.fillStyle=g;ctx.fillRect(fx-fr*4,fy-fr*4,fr*8,fr*8);
  ctx.fillStyle='#ffd166';ctx.beginPath();ctx.arc(fx,fy,fr*pulse,0,Math.PI*2);ctx.fill();
  // snake
  for(let i=snake.length-1;i>=0;i--){
    const s=snake[i],x=s.x*cell,y=s.y*cell,t=1-i/snake.length;
    const r=cell*.45*(0.6+0.4*t);
    const hue=170+t*40;
    ctx.fillStyle='hsla('+hue+',90%,'+(45+t*15)+'%,.95)';
    ctx.shadowBlur=18*t;ctx.shadowColor='hsla('+hue+',95%,60%,.8)';
    ctx.beginPath();ctx.arc(x+cell/2,y+cell/2,r,0,Math.PI*2);ctx.fill();
  }
  ctx.shadowBlur=0;
  // eyes
  if(snake[0]){const h=snake[0],hx=h.x*cell+cell/2,hy=h.y*cell+cell/2,ex=dir.x*cell*.18,ey=dir.y*cell*.18,perp={x:-dir.y,y:dir.x};
    for(const s of [1,-1]){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(hx+ex+perp.x*cell*.18*s,hy+ey+perp.y*cell*.18*s,cell*.09,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#04060c';ctx.beginPath();ctx.arc(hx+ex*1.6+perp.x*cell*.18*s,hy+ey*1.6+perp.y*cell*.18*s,cell*.05,0,Math.PI*2);ctx.fill();}
  }
  // particles
  for(const p of particles){ctx.fillStyle=p.color;ctx.globalAlpha=Math.max(0,p.life/50);ctx.fillRect(p.x*cell+cell/2-2,p.y*cell+cell/2-2,4,4);p.x+=p.vx*.02;p.y+=p.vy*.02;p.life--;}
  ctx.globalAlpha=1;particles=particles.filter(p=>p.life>0);
  tick++;
}
let last=0,acc=0,SPEED=110;
function loop(t){requestAnimationFrame(loop);const dt=t-last;last=t;if(!alive){draw();return;}acc+=dt;while(acc>SPEED){step();acc-=SPEED;}draw();}
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();let nd=null;
  if(k==='arrowup'||k==='w')nd={x:0,y:-1};else if(k==='arrowdown'||k==='s')nd={x:0,y:1};else if(k==='arrowleft'||k==='a')nd={x:-1,y:0};else if(k==='arrowright'||k==='d')nd={x:1,y:0};
  if(nd&&(nd.x!==-dir.x||nd.y!==-dir.y))nextDir=nd;
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase())||['w','a','s','d'].includes(k))e.preventDefault();
});
btn.onclick=()=>{reset();msg.classList.add('hidden');requestAnimationFrame(loop);};
reset();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
