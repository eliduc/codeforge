<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeForge Preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; color: #ccc; font-family: system-ui, sans-serif; overflow: hidden; }
  #__loading { display: flex; align-items: center; justify-content: center; height: 100vh; font-size: 16px; color: #888; }
  #__preview-frame { width: 100%; height: 100vh; border: none; }
</style>
</head>
<body>
<div id="__loading">Waiting for content...</div>
<script>
// Sandbox frame: receives HTML content via postMessage and renders it
// inside a child iframe using srcdoc.
//
// This page is served by nginx with a PERMISSIVE CSP so external CDN
// scripts (Three.js, D3, Babylon.js, p5.js, etc.) can load freely.
//
// CDN URL patching: LLMs sometimes generate code referencing CDN paths
// that no longer exist (e.g. Three.js removed build/three.min.js in r161+).
// We automatically rewrite known broken patterns to working URLs.

function patchCdnUrls(html) {
  // Three.js r161+ removed build/three.min.js and build/three.js (UMD builds).
  // Rewrite to r160 which is the last version that ships them.
  // Matches versions >= 0.161: 0.161-0.169, 0.170-0.199, 0.200-0.999, 0.1000+
  html = html.replace(
    /three@0\.(16[1-9]|1[7-9]\d|[2-9]\d\d|\d{4,})\.\d+\/build\/three(\.min)?\.js/g,
    'three@0.160.0/build/three.min.js'
  );
  return html;
}

window.addEventListener('message', function(event) {
  var data = event.data;
  if (data && data.type === 'codeforge-preview' && typeof data.html === 'string') {
    // Strip CSP meta tags that would block CDN script loading
    var html = data.html.replace(
      /<meta\s+http-equiv\s*=\s*["']Content-Security-Policy["'][^>]*>/gi,
      '<!-- CSP meta removed by CodeForge sandbox -->'
    );

    // Fix known broken CDN URLs
    html = patchCdnUrls(html);

    // Remove loading indicator
    var loading = document.getElementById('__loading');
    if (loading) loading.remove();

    // Remove previous preview frame if any
    var oldFrame = document.getElementById('__preview-frame');
    if (oldFrame) oldFrame.remove();

    // Create child iframe with srcdoc — it inherits this page's permissive CSP
    var frame = document.createElement('iframe');
    frame.id = '__preview-frame';
    frame.style.cssText = 'width:100%;height:100vh;border:none;';
    frame.srcdoc = html;
    document.body.appendChild(frame);
  }
});
// Signal to parent that we are ready to receive content
if (window.parent !== window) {
  window.parent.postMessage({ type: 'codeforge-sandbox-ready' }, '*');
}
</script>
</body>
</html>
