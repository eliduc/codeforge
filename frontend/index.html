<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/codeforge.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeForge - Multi-Agent Code Generation</title>
    <script>
      // Prevent flash-of-wrong-theme by reading saved preference before CSS renders
      try {
        var t = JSON.parse(localStorage.getItem('codeforge-theme-storage') || '{}');
        if (t && t.state && t.state.theme === 'light') document.documentElement.classList.remove('dark');
      } catch(e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body class="bg-cf-bg text-cf-text">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
