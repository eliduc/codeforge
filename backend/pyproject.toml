[project]
name = "codeforge"
version = "1.0.0"
description = "Multi-agent LLM code generation and audit system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.25",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.6",
    "httpx>=0.26.0",
    "openai>=1.10.0",
    "anthropic>=0.18.0",
    "google-genai>=1.60.0",  # КАО#R2-10 — code imports `from google import genai` (new unified SDK); was the old incompatible google-generativeai
    "docker>=7.0.0",
    "jinja2>=3.1.3",
    "python-jose[cryptography]>=3.4.0,<4",  # КАО#R2-10 — align with requirements.txt (CVE-2024-33664; R1-12)
    "passlib[bcrypt]>=1.7.4",
    "aiofiles>=23.2.1",
    "weasyprint>=60.2",
    "markdown>=3.5.2",
    "pygments>=2.17.2",
    "aiosmtplib>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "black>=24.1.0",
    "ruff>=0.1.14",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

# KAO#Full-C-2 M4 — async test teardown noise filter.
# asyncpg/SQLAlchemy hold pooled connections bound to whichever event loop
# created them. When pytest-asyncio (mode=auto, function-scoped loops) tears
# down a loop with pooled-but-idle connections still in it, asyncpg attempts
# to send a final wire packet on the closed loop and surfaces a
# "Event loop is closed" RuntimeError as PytestUnraisableExceptionWarning.
# The conftest already calls `await engine.dispose()` on each function-scoped
# auth fixture; this filter suppresses the residual unraisable from sockets
# that asyncpg's transport closes after our dispose completes (no behavioral
# impact, the test process is exiting). Root cause documented; if a stricter
# fix is required, switch the SQLAlchemy engine to NullPool in conftest.
[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
